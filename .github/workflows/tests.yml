name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - run: python -m heart_tinyml verify-model
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_publication.py
  research-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.0.2 scipy==1.15.3 pyserial==3.5
      - run: python -m pip install --no-deps -e ./research
      - run: python -m unittest discover -s research/tests -v
