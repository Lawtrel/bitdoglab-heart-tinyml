[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitdoglab-heart-research"
version = "0.1.0"
description = "Pipeline científico CirCor preservado em pacote separado"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.0.2", "scipy==1.15.3", "pyserial==3.5"]

[project.scripts]
pcg = "pcg.cli:main"

[tool.setuptools.packages.find]
include = ["pcg*"]
